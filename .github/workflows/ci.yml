name: CI

# Typecheck, lint, tests and build for both workspaces. Needs no secrets and touches no database
# (the database tests run on in-memory Postgres). Browser tests are run by hand: see README.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test # after the build, so the "no secrets in the bundle" check runs too
